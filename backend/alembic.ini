[alembic]
script_location = alembic
prepend_sys_path = .
# Prefixo de data no nome do arquivo: a ordem cronologica das migracoes fica
# obvia no diretorio, sem precisar abrir cada uma para ver a cadeia de revisoes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# sqlalchemy.url NAO fica aqui: vem de DATABASE_URL via app.core.config
# (ver alembic/env.py). Credencial em arquivo versionado, nunca.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
